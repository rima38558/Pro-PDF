name: Python CI

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.10]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e backend

      - name: Wait for services
        run: |
          for i in {1..30}; do nc -z localhost 5432 && nc -z localhost 6379 && break || sleep 1; done

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Check migrations up-to-date
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          set -e
          echo "Checking for pending autogenerated migrations..."
          BEFORE_FILES="$(ls backend/alembic/versions || true)"
          alembic -c backend/alembic.ini revision --autogenerate -m "ci-autogen-check" || true
          AFTER_FILES="$(ls backend/alembic/versions || true)"
          for f in $AFTER_FILES; do
            if ! echo "$BEFORE_FILES" | tr ' ' '\n' | grep -x "$f" >/dev/null 2>&1; then
              # new file generated
              if grep -qE 'op.create_table|op.add_column|op.drop_table|op.drop_column|op.alter_column|batch_alter_table|sa.Column' "backend/alembic/versions/$f"; then
                echo "ERROR: Alembic autogenerate detected schema changes in generated migration: $f"
                echo "Please generate and commit the migration (make alembic-rev NAME=\"desc\")."
                exit 1
              fi
              rm -f "backend/alembic/versions/$f" || true
            fi
          done

      - name: Run tests with coverage
        env:
          SENDGRID_API_KEY: ''
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pip install pytest-cov
          mkdir -p reports
          python -m pytest --junitxml=reports/junit.xml --cov=backend --cov-report=xml:reports/coverage.xml -q

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
