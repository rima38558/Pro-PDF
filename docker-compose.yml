version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pro_pdf
      POSTGRES_PASSWORD: pro_pdf_pass
      POSTGRES_DB: pro_pdf_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pro_pdf:pro_pdf_pass@db:5432/pro_pdf_db
      - REDIS_URL=redis://redis:6379/0
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@pro-pdf.local}
      - APP_URL=${APP_URL:-http://localhost:5173}
      - USE_S3=${USE_S3:-false}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/data:/app/data

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery worker --loglevel=info
    depends_on:
      - redis
      - db
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@pro-pdf.local}
      - APP_URL=${APP_URL:-http://localhost:5173}
      - USE_S3=${USE_S3:-false}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./backend:/app

  migrate:
    build: ./backend
    command: alembic -c /app/alembic.ini upgrade head
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://pro_pdf:pro_pdf_pass@db:5432/pro_pdf_db
    volumes:
      - ./backend:/app

  minio:
    image: minio/minio:RELEASE.2024-03-21T01-35-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://backend:8000

volumes:
  pgdata:
  miniodata:
